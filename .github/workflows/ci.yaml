name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code

      - name: Format check
        run: make fmt-check

      - name: Static analysis
        run: make vet

      - name: Architecture conformance
        run: make conformance

      - name: Fast tests
        run: make test-fast

      - name: Infrastructure integration tests
        run: make test-integration

      - name: Build
        run: go build ./cmd/grandet
