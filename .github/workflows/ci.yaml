name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code

      - name: Format check
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"

      - name: Static analysis
        run: go vet ./...

      - name: Architecture conformance
        run: go test ./internal/architecture

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/grandet
