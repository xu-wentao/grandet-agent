name: Bug report
description: Report a reproducible problem in implemented behavior.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the [architecture](https://github.com/xu-wentao/grandet-agent/blob/main/docs/architecture.md) and [business logic](https://github.com/xu-wentao/grandet-agent/blob/main/docs/business-logic.md) to distinguish an implemented defect from planned behavior.
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include the error without secrets.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest command, configuration, and environment needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: This affects workspace migration, configuration, or provider compatibility.
        - label: This affects trajectory cost, trace, routing, validation, or policy behavior.
  - type: textarea
    id: verification
    attributes:
      label: Verification idea
      description: What regression test or CLI check should prevent recurrence?
